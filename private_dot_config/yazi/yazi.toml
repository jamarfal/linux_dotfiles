[manager]
layout          = [ 1, 4, 3 ]     # Proporción de paneles
sort_by         = "alphabetical"
sort_sensitive  = false
sort_reverse    = false
sort_dir_first  = true            # Directorios siempre primero
show_hidden     = true            # Mostrar archivos ocultos por defecto
show_symlink    = true

[preview]
tab_size        = 2
max_width       = 1000
max_height      = 1000

[opener]
edit = [
    { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
    { run = 'open "$@"', desc = "Abrir con aplicación por defecto de macOS" },
]

[open]
rules = [
    { name = "*/", use = [ "edit", "open" ] },
    { mime = "text/*", use = [ "edit", "open" ] },
    { mime = "application/json", use = [ "edit", "open" ] },
    { mime = "*", use = [ "open" ] },
]
